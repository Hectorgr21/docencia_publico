site_name: Docencia · Héctor Gómez R.
site_description: Material para alumnos · Periodo 2026-3 (Sep–Dic 2026)
site_url: https://Hectorgr21.github.io/docencia_publico/
repo_url: https://github.com/Hectorgr21/docencia_publico
copyright: Héctor Gómez R. · UTN División de Telemática

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: deep orange
      accent: light blue
      toggle: { icon: material/weather-night, name: Modo oscuro }
    - scheme: slate
      primary: deep orange
      accent: light blue
      toggle: { icon: material/weather-sunny, name: Modo claro }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

exclude_docs: |
  conocimiento/soluciones/_plantilla-solucion.md
  conocimiento/README.md
not_in_nav: |
  conocimiento/soluciones/*.md
  conocimiento/conceptos/*.md
  */*-s01.md

hooks:
  - hooks/publico.py     # quita del sitio lo que no se publicó
  - hooks/incrustar.py   # ![[nota]] de Obsidian también incrusta en el sitio


extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: es
  - roamlinks          # convierte [[enlaces estilo Obsidian]] en links reales
  - glightbox          # clic en imagen = zoom

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }

